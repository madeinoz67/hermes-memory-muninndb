name: muninndb
version: 2.0.0
description: >
  MuninnDB — knowledge graph memory with semantic search, entity tracking,
  hierarchical organization, enrichment pipeline, audit/debug tools, and
  automatic turn syncing via MCP streamable-http transport.
  Exposes 33 tools: search, remember, entities + 6 P0 lifecycle +
  4 knowledge graph + 8 entity management + 3 quality + 9 P2 advanced tools.
